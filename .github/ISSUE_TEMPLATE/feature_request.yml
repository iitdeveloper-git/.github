name: "🚀 Feature Request"
description: "Propose a new feature, improvement, or architectural enhancement"
title: "[Feature]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to IITDEVELOPER platforms!
  - type: textarea
    id: problem
    attributes:
      label: "Problem Statement"
      description: "Is your feature request related to a problem or limitation? Please describe."
      placeholder: "I am always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: "Proposed Solution / Enhancement"
      description: "Describe the solution you would like to see implemented."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Describe any alternative solutions or workarounds you've considered."
    validations:
      required: false
  - type: dropdown
    id: target_area
    attributes:
      label: "Target Area"
      options:
        - "AI & Intelligent Systems"
        - "Identity & Access (IAM)"
        - "Notification Infrastructure (GNS)"
        - "Platform CI/CD & DevOps"
        - "Frontend / UI / UX"
        - "Database & Backend API"
        - "Other"
    validations:
      required: true
  - type: checkboxes
    id: willing_to_contribute
    attributes:
      label: "Contribution"
      options:
        - label: "I am willing to submit a Pull Request for this feature."
          required: false
