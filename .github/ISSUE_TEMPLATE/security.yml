name: "🔒 Security Vulnerability (Private Disclosure)"
description: "Instructions for reporting security vulnerabilities responsibly"
title: "[SECURITY]: "
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ DO NOT REPORT SECURITY VULNERABILITIES PUBLICLY

        To protect user security and data privacy, please **do not** open public issues containing sensitive vulnerability details.

        ### Responsible Disclosure Steps:
        1. Review our full [Security Policy](../../SECURITY.md).
        2. Email the details to **[security@iitdeveloper.com](mailto:security@iitdeveloper.com)** (or fallback to **[info@iitdeveloper.com](mailto:info@iitdeveloper.com)**).
        3. Include vulnerability type, affected repository/component, reproduction steps, and potential impact.

        We acknowledge reports within 48 hours and work with you on remediation and disclosure.
