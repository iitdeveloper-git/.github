name: "🐛 Bug Report"
description: "Report a reproducible problem or error in an IITDEVELOPER repository"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem.
        *If this is a security vulnerability, please refer to our [Security Policy](../../SECURITY.md) instead.*
  - type: input
    id: version
    attributes:
      label: "Component / Version"
      description: "Which service, repository branch, commit, or package version are you running?"
      placeholder: "e.g., iam @ main (commit 4a2b1c) or ett_gns v1.2.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description of the Bug"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the behavior:"
      value: |
        1. Deploy or start '...'
        2. Send request to '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior & Error Logs"
      description: "Paste relevant error outputs, stack traces, or console logs. Redact any sensitive tokens."
      render: shell
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      description: "Where did this occur?"
      options:
        - "Local Docker Development"
        - "Staging / QA"
        - "Production"
        - "CI/CD Pipeline"
        - "Other"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: "Checklist"
      options:
        - label: "I have confirmed that no private credentials or secret tokens are present in this issue."
          required: true
        - label: "I have searched existing issues to ensure this is not a duplicate."
          required: true
